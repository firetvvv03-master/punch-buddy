<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punch Buddy</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px;
}

#arena{
    position:relative;
    width:100vw;
    height:75vh;
}

#rope{
    width:6px;
    height:80px;
    background:white;
    margin:auto;
}

#bag{
    width:220px;
    height:280px;
    background:#b22222;
    border-radius:25px;
    margin:auto;
    position:relative;
    transform-origin:top center;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

#photo{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    margin-top:30px;
    border:5px solid white;
}

#scoreboard{
    font-size:22px;
    margin:15px;
}

button,input{
    margin:5px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.hit{
    animation:hit .15s;
}

@keyframes hit{
    50%{transform:scale(0.95);}
}

.shake{
    animation:shake .2s;
}

@keyframes shake{
    0%{transform:translateX(-8px);}
    50%{transform:translateX(8px);}
    100%{transform:translateX(0);}
}

#combo{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:30px;
    color:gold;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🥊 Punch Buddy</h1>

<input type="file" id="upload" accept="image/*">

<div id="scoreboard">
    Score: <span id="score">0</span>
</div>

<div id="arena">
    <div id="combo"></div>

    <div id="rope"></div>

    <div id="bag">
        <img id="photo">
    </div>
</div>

<script>
const upload = document.getElementById("upload");
const photo = document.getElementById("photo");
const bag = document.getElementById("bag");

let score = 0;
let combo = 0;
let angle = 0;

upload.addEventListener("change",(e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = ()=>{
        photo.src = reader.result;
    };
    reader.readAsDataURL(file);
});

bag.addEventListener("click", punch);

function punch(){

    score += 10;
    combo++;

    document.getElementById("score").textContent = score;
    document.getElementById("combo").textContent =
        "🔥 Combo x" + combo;

    angle = angle === 15 ? -15 : 15;

    bag.style.transform =
        `rotate(${angle}deg)`;

    bag.classList.add("hit");
    document.body.classList.add("shake");

    setTimeout(()=>{
        bag.classList.remove("hit");
        document.body.classList.remove("shake");
    },150);

    clearTimeout(window.comboTimer);

    window.comboTimer = setTimeout(()=>{
        combo = 0;
        document.getElementById("combo").textContent = "";
    },2000);
}
</script>

</body>
</html>
